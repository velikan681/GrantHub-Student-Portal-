{% extends 'portal/base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <h1>Восстановление пароля</h1>
    <p class="text-secondary">Введите email. В режиме разработки письмо будет показано в консоли сервера.</p>
    <form method="post" class="vstack gap-3">{% csrf_token %}
      {{ form.email.label_tag }}{{ form.email }}
      <button class="btn btn-primary">Отправить ссылку</button>
    </form>
  </div>
</div>
{% endblock %}
